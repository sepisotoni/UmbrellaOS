name: TypeScript SDK CI

on:
  push:
    branches: [main]
    paths:
      - "umbrella-sdk-ts/**"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "umbrella-sdk-ts/**"
      - ".github/workflows/sdk-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: umbrella-sdk-ts/package-lock.json

      - name: Install dependencies
        working-directory: umbrella-sdk-ts
        run: npm ci

      - name: Type check and build
        working-directory: umbrella-sdk-ts
        run: |
          npm run typecheck
          npm run build
