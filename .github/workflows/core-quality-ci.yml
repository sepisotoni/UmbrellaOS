name: Core Quality Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "umbrella-core-CURRENT/**"
      - ".github/workflows/core-quality-ci.yml"
  workflow_dispatch: {}

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Core and analysis tools
        run: |
          python -m pip install -r umbrella-core-CURRENT/requirements.txt
          python -m pip install ruff pyright
      - name: Ruff unused imports, undefined names, and syntax hygiene
        run: ruff check umbrella-core-CURRENT --select E4,E7,E9,F
      - name: Pyright type and interface validation
        if: success() || failure()
        run: pyright umbrella-core-CURRENT

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit pinned Core runtime requirements
        run: python -m pip_audit -r umbrella-core-CURRENT/requirements.txt
