# UmbrellaOS plugin — local config.
#
# This is the plugin's OWN config file, generated on first run. It is not
# the same thing as umbrella-core's GET /api/v1/plugin/config response
# (that's a separate, server-side settings bundle the plugin pulls down
# and applies at runtime — see ConfigManager).

core:
  # Root URL of umbrella-core, no trailing slash and no path suffix.
  # Example: http://localhost:8000  or  https://core.example.com
  base-url: "https://umbrellaos-core.onrender.com"

  # Shared secret sent as the X-Plugin-Key header on every request.
  # Must match umbrella-core's SECRET_KEY (or an equivalent X-Admin-Key —
  # both are accepted by require_plugin_key, but the plugin should always
  # use its own plugin key here).
  plugin-key: "CHANGE-ME"

heartbeat:
  # How often to POST /api/v1/plugin/heartbeat, in seconds.
  interval-seconds: 30

commands:
  # How often to atomically claim queued commands from core, in seconds.
  # Claimed rows are not re-issued if a completion acknowledgement is lost.
  poll-interval-seconds: 5

server:
  # Unique identifier for this Minecraft server instance.
  # Sent as server_id in:
  #   - POST /api/v1/plugin/heartbeat  (identifies the server in the dashboard)
  #   - POST /api/v1/anticheat/flag    (tags each GrimAC violation so the
  #     dashboard's server_id filter on GET /api/v1/anticheat/violations works)
  # When running multiple servers against one umbrella-core, give each a
  # distinct value (e.g. "survival", "creative", "minigames").
  # Leave blank to use "default" — fine for single-server setups.
  id: "default"
  name: "Minecraft Server"

greeter:
  # Set to false to disable welcome messages entirely.
  enabled: true

chat_responder:
  # Set to false to disable AI responses to common chat questions.
  enabled: true
