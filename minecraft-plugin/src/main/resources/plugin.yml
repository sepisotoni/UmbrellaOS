name: UmbrellaOSPlugin
version: '${project.version}'
main: com.umbrellaos.plugin.UmbrellaPlugin
api-version: '26.2'
author: Sepiso Toni
description: >
  UmbrellaOS core integration for Minecraft servers. Heartbeat, config sync,
  command-queue polling, join-time ban enforcement, and GrimAC anticheat
  flag forwarding.
website: https://github.com/sepisotoni/UmbrellaOS
# softdepend (not depend) — the plugin loads and functions without GrimAC;
# the GrimBridge simply stays inactive. Paper uses this to ensure GrimAC's
# API classes are classloaded before ours when both plugins are present,
# which is required for our compile-time import of GrimAC's EventBus API.
softdepend:
  - GrimAC

commands:
  verify:
    description: Link your Minecraft account to Discord using a verification code.
    usage: /verify <code>
    permission: umbrellaos.verify
    permission-message: §cYou do not have permission to use this command.
  umbrella:
    description: UmbrellaOS plugin status and help commands.
    usage: /umbrella <status|help>
    aliases: [uos]
    permission: umbrellaos.umbrella
    permission-message: §cYou do not have permission to use this command.
  appeal:
    description: Get information on appealing a server punishment.
    usage: /appeal
    permission: umbrellaos.appeal
    permission-message: §cYou do not have permission to use this command.

permissions:
  umbrellaos.verify:
    description: Allows players to verify their account with Discord.
    default: true
  umbrellaos.umbrella:
    description: Allows players to view UmbrellaOS status and help.
    default: true
  umbrellaos.appeal:
    description: Allows players to view appeal information.
    default: true
