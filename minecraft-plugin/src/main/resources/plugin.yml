name: UmbrellaOSPlugin
version: '${project.version}'
main: com.umbrellaos.plugin.UmbrellaPlugin
api-version: '26.2'
author: Sepiso Toni
description: >
  UmbrellaOS core integration for Minecraft servers. Heartbeat, config sync,
  command-queue polling, join-time ban enforcement, and GrimAC anticheat
  flag forwarding.
website: https://github.com/sepisotoni/UmbrellaOS
# softdepend (not depend) — the plugin loads and functions without GrimAC;
# the GrimBridge simply stays inactive. Paper uses this to ensure GrimAC's
# API classes are classloaded before ours when both plugins are present,
# which is required for our compile-time import of GrimAC's EventBus API.
softdepend:
  - GrimAC
