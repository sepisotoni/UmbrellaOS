name: UmbrellaOSPlugin
version: '${project.version}'
main: com.umbrellaos.plugin.UmbrellaPlugin
api-version: '1.20'
author: Sepiso Toni
description: >
  UmbrellaOS core integration for Minecraft servers. Step 1: heartbeat and
